name: Build OP Embedded Studio

on:
  workflow_dispatch:
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: ./.github/actions/setup-bun

      - name: Validate desktop release tag
        if: startsWith(github.ref, 'refs/tags/studio-v')
        shell: bash
        run: |
          expected="studio-v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "Desktop tag ${{ github.ref_name }} does not match package version $expected"
            exit 1
          fi

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_notes<<$EOF" >> "$GITHUB_OUTPUT"
          awk '/^## /{if(found)exit; found=1; next} found{print}' CHANGELOG.md >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        if: startsWith(github.ref, 'refs/tags/studio-v')
        id: release_meta
        shell: bash
        run: echo "name=OP Embedded Studio ${GITHUB_REF_NAME#studio-v}" >> "$GITHUB_OUTPUT"

      - name: Add new contributors to release notes
        if: startsWith(github.ref, 'refs/tags/studio-v')
        id: release_body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        run: |
          PREV_TAG=$(git tag -l 'studio-v*' --sort=-version:refname | sed -n '2p')
          NEW=""
          if [ -n "$PREV_TAG" ]; then
            PREV=$(git log "$PREV_TAG" --format='%aE' | sort -u)
            NEW=$(comm -23 \
              <(git log "${PREV_TAG}..${{ github.ref_name }}" --format='%aE' | sort -u) \
              <(echo "$PREV") \
            | while read -r email; do
                git log "${PREV_TAG}..${{ github.ref_name }}" --format="%aE %aN" \
                  | grep "^${email} " | head -1 | sed 's/^[^ ]* //'
              done)
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            printf '%s\n' "$RELEASE_NOTES"
            if [ -n "$NEW" ]; then
              echo ""
              echo "### New Contributors"
              echo ""
              echo "$NEW" | while read -r name; do echo "- $name"; done
            fi
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/studio-v') && github.ref_name || '' }}
          releaseName: ${{ steps.release_meta.outputs.name || '' }}
          releaseBody: ${{ steps.release_body.outputs.body || steps.changelog.outputs.release_notes }}
          releaseDraft: true
